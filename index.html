<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Shield against browser wallet extension injection conflicts (e.g. TypeError: Cannot redefine property: ethereum) */
      (function () {
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (obj, prop, descriptor) {
            if (obj === window && prop === 'ethereum') {
              try {
                return origDefineProperty.call(Object, obj, prop, Object.assign({}, descriptor, { configurable: true }));
              } catch (e) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    window.ethereum = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            return origDefineProperty.apply(Object, arguments);
          };
        } catch (_) {}

        window.addEventListener(
          'error',
          function (e) {
            var src = (e && e.filename) ? String(e.filename) : '';
            var msg = (e && e.message) ? String(e.message) : '';
            if (
              src.indexOf('chrome-extension://') !== -1 ||
              src.indexOf('moz-extension://') !== -1 ||
              src.indexOf('evmAsk.js') !== -1 ||
              msg.indexOf('ethereum') !== -1 ||
              msg.indexOf('Cannot redefine property: ethereum') !== -1
            ) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.preventDefault) e.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e ? e.reason : null;
            var msg = reason && reason.message ? String(reason.message) : String(reason || '');
            var stack = reason && reason.stack ? String(reason.stack) : '';
            if (
              stack.indexOf('chrome-extension://') !== -1 ||
              stack.indexOf('evmAsk.js') !== -1 ||
              msg.indexOf('ethereum') !== -1
            ) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.preventDefault) e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>Team Uniuyo Competitions Hub</title>
    <meta name="description" content="Official management and tracking platform for legal and academic competitions at the University of Uyo, Nigeria." />
    <meta property="og:title" content="Team Uniuyo Competitions Hub" />
    <meta property="og:description" content="Official management and tracking platform for legal and academic competitions at the University of Uyo, Nigeria." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
